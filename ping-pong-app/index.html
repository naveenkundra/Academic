<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>Ping Pong</h1>

    <div class="scoreboard">
      <div class="score">
        <span class="label">Player</span>
        <span id="playerScore">0</span>
      </div>
      <div class="score">
        <span class="label" id="opponentLabel">CPU</span>
        <span id="opponentScore">0</span>
      </div>
    </div>

    <canvas id="board" width="800" height="500"></canvas>

    <div class="controls">
      <div class="mode-select">
        <label>
          <input type="radio" name="mode" value="cpu" checked />
          1 Player (vs CPU)
        </label>
        <label>
          <input type="radio" name="mode" value="2p" />
          2 Players
        </label>
      </div>

      <div class="buttons">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>

      <p class="instructions">
        Player 1: <kbd>W</kbd> / <kbd>S</kbd> &nbsp;|&nbsp;
        Player 2 (2P mode): <kbd>&uarr;</kbd> / <kbd>&darr;</kbd> &nbsp;|&nbsp;
        First to 11 wins
      </p>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlayTitle">Ping Pong</h2>
        <p id="overlayMessage">Press Start to play</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
